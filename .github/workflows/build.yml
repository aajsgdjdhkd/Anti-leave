name: Build and Upload Model

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install git+https://github.com/Anaminus/rbxfile.git requests

      - name: Build .rbxm
        run: python build.py

      - name: Upload to Roblox Assets API
        env:
          RBXCLOUD_API_KEY: ${{ secrets.RBXCLOUD_API_KEY }}
        run: python upload.py
